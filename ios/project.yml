name: ZephyrStation
options:
  bundleIdPrefix: com.zephyr
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: P7XMVL7643

targets:
  ZephyrStation:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - ZephyrStation
    info:
      path: ZephyrStation/Info.plist
      properties:
        CFBundleDisplayName: Zephyr
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "5"
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.miko.portfolioapp
        INFOPLIST_FILE: ZephyrStation/Info.plist
        CODE_SIGN_ENTITLEMENTS: ZephyrStation/ZephyrStation.entitlements
    dependencies:
      - target: ZephyrWidgetExtension

  ZephyrStationTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources:
      - ZephyrStationTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.miko.portfolioapp.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ZephyrStation

  ZephyrWidgetExtension:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - ZephyrWidget
      - path: ZephyrStation/ZephyrWidgetAttributes.swift
      - path: ZephyrStation/WeatherService.swift
      - path: ZephyrStation/WeatherData.swift
      - path: ZephyrStation/HistoryData.swift
      - path: ZephyrStation/GasResistanceFormatting.swift
    info:
      path: ZephyrWidget/Info.plist
      properties:
        CFBundleDisplayName: ZephyrStation
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "5"
        LSApplicationCategoryType: ""
        LSBundleContainsCoreMLmlmodelc: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.miko.portfolioapp.widget
        INFOPLIST_FILE: ZephyrWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: ZephyrWidget/ZephyrWidget.entitlements

schemes:
  ZephyrStation:
    build:
      targets:
        ZephyrStation: all
        ZephyrWidgetExtension: all
        ZephyrStationTests: [test]
    test:
      targets:
        - ZephyrStationTests
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
