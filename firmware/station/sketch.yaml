profiles:
  esp32:
    notes: Zephyr outdoor station on ESP32 Dev Module
    fqbn: esp32:esp32:esp32:UploadSpeed=115200,FlashMode=dio,FlashFreq=80,FlashSize=4M,PartitionScheme=default,EraseFlash=none
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - Adafruit Unified Sensor (1.1.15)
      - Adafruit BME680 Library (2.0.5)
      - dependency: Adafruit BusIO (1.17.4)
      - Adafruit INA219 (1.2.3)
      - dir: ../../build/firmware/dependencies/grove-lora
default_profile: esp32
